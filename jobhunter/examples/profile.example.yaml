# Пример профиля вымышленного кандидата. Ваш профиль создаёт `jobhunter profile` из резюме;
# дальше его можно править руками. match — регулярное выражение по тексту требования вакансии.
name: Анна Смирнова
headline: Руководитель ИТ-проектов
summary: >-
  12 лет в управлении ИТ-проектами: внедрение ERP и CRM в производственных компаниях, команды до 25 человек,
  бюджеты до 80 млн ₽. Запустила с нуля проектный офис на 6 РП. Agile и водопад, работа с подрядчиками.
years:
  default: 12
  areas:
    - { match: "продакт|product|продукт", years: 2 }
    - { match: "руковод\\w* (команд|отдел)|team ?lead", years: 6 }
english: B1
education:
  level: высшее
  field: техническое (АСУ)
  match: "техническ|информац|информатик|математ|асу"
skills:
  - { match: "управлени\\w* (ит-|it-)?проект|ведени\\w* проект|project manag|менеджер\\w* проект|внедрени", note: "12 лет РП, внедрения ERP/CRM" }
  - { match: "\\berp\\b|1с|sap", note: "внедрение 1С:ERP на 3 заводах" }
  - { match: "crm", note: "внедрение CRM для отдела продаж 200 пользователей" }
  - { match: "бюджет|capex|opex|экономик\\w* проект", note: "бюджеты до 80 млн ₽" }
  - { match: "подрядчик|вендор|поставщик|договор", note: "управление 4 подрядчиками" }
  - { match: "agile|scrum|kanban|гибк\\w* методолог", note: "Scrum в команде 25 человек" }
  - { match: "jira|confluence|ms project|gantt|ганта", note: "Jira, Confluence, MS Project" }
  - { match: "риск", note: "реестр рисков, еженедельный контроль" }
  - { match: "стейкхолдер|заказчик|топ-менеджмент|презентац", note: "отчётность перед советом директоров" }
  - { match: "(руковод|управл)\\w* (команд|подразделени)|кросс-?функциональн", note: "команда до 25, 6 РП в подчинении" }
  - { match: "pmo|проектн\\w* офис|портфел", note: "создала проектный офис с нуля" }
  - { match: "требовани|тз\\b|техническ\\w* задани", note: "ТЗ и приёмка по ГОСТ 34" }
  - { match: "производств|промышлен", note: "8 лет в промышленности" }
partial:
  - { match: "product|продакт|продукт", note: "2 года владельцем внутреннего продукта" }
  - { match: "\\bsql\\b", note: "SQL на уровне простых выборок" }
  - { match: "b2c", note: "только внутренние B2B-системы" }
hidden:
  - { match: "\\bии\\b|chatgpt|\\bai\\b|llm", note: "использует ChatGPT в работе — в резюме не указано" }
missing:
  - { match: "\\bml\\b|machine learning|машинн\\w* обучени|data science", note: "нет опыта ML", hard: true }
  - { match: "мобильн\\w* (разработк|приложени)|ios\\b|android", note: "нет мобильной разработки", hard: true }
  - { match: "a/b|продуктов\\w* аналитик|amplitude|воронк", note: "нет продуктовой аналитики", hard: true }
  - { match: "\\bjava\\b|python|golang|программиров", note: "не разработчик" }
  - { match: "маркетинг|marketing|реклам", note: "нет маркетинга", hard: true }
